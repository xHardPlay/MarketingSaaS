<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Graphic Design Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Simple Graphic Design Tool</h1>
    <div class="container">
        <div class="left-panel">
            <div class="xlsx-upload-section">
                <label for="xlsx-upload">Upload XLSX File:</label>
                <input type="file" id="xlsx-upload" accept=".xlsx,.xls">
            </div>

            <button id="download-btn">Download Image</button>

            <div id="rows-summary"></div>
        </div>

        <div class="center-panel">
            <div class="canvas-section">
                <canvas id="canvas"></canvas>
                <div class="canvas-controls">
                    <label>Canvas Size:</label>
                    <input type="number" id="canvas-width" value="800" min="100" max="2000" placeholder="Width">
                    <input type="number" id="canvas-height" value="600" min="100" max="2000" placeholder="Height">
                    <button id="resize-canvas">Resize</button>
                    <div class="canvas-presets">
                        <button id="preset-instagram">Instagram (1080x1080)</button>
                        <button id="preset-instagram-story">Story (1080x1920)</button>
                        <button id="preset-facebook">Facebook (1200x630)</button>
                    </div>
                </div>
            </div>

            <div class="element-controls">
                <button id="add-text-btn">➕ Add Text</button>
                <button id="add-logo-btn">🖼️ Add Logo</button>
                <button id="delete-element-btn" style="background-color: #dc3545;">🗑️ Delete Selected</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="controls">
                <div class="text-section">
                    <h3>Text Properties</h3>
                    <div class="inline-group">
                        <input type="text" id="text-input" placeholder="Text">
                        <select id="text-font">
                            <option value="Arial">Arial</option>
                            <option value="Times New Roman">Times</option>
                            <option value="Courier New">Courier</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Impact">Impact</option>
                            <option value="Comic Sans MS">Comic</option>
                            <option value="Trebuchet MS">Trebuchet</option>
                            <option value="Lucida Sans">Lucida</option>
                            <option value="Tahoma">Tahoma</option>
                            <option value="Open Sans">Open Sans</option>
                        </select>
                    </div>
                    <div class="slider-compact">
                        <label>X:</label>
                        <input type="range" id="text-x-slider" value="50" min="0" max="800">
                        <input type="number" id="text-x" value="50" min="0" max="800" style="width:50px;">
                    </div>
                    <div class="slider-compact">
                        <label>Y:</label>
                        <input type="range" id="text-y-slider" value="100" min="0" max="600">
                        <input type="number" id="text-y" value="100" min="0" max="600" style="width:50px;">
                    </div>
                    <div class="slider-compact">
                        <label>Size:</label>
                        <input type="range" id="text-size-slider" value="45" min="10" max="100">
                        <input type="number" id="text-size" value="45" min="10" max="100" style="width:50px;">
                    </div>
                    <div class="color-group">
                        <label>Color:</label>
                        <input type="color" id="text-color" value="#000000">
                        <button class="color-btn" data-color="#000000">⬛</button>
                        <button class="color-btn" data-color="#ffffff">⬜</button>
                    </div>
                    <label class="outline-label">
                        <input type="checkbox" id="text-outline">
                        Outline
                    </label>
                </div>

                <div class="logo-section">
                    <h3>Image Properties</h3>
                    <label for="logo-upload">Upload Logo:</label>
                    <input type="file" id="logo-upload" accept="image/*">
                    <label for="logo-tint">Tint Color:</label>
                    <input type="color" id="logo-tint" value="#ffffff">
                    <div class="slider-group">
                        <label for="logo-x">X Position:</label>
                        <input type="number" id="logo-x" value="600" min="0" max="800">
                    </div>
                    <div class="slider-group">
                        <label for="logo-y">Y Position:</label>
                        <input type="number" id="logo-y" value="50" min="0" max="600">
                    </div>
                    <div class="slider-group">
                        <label for="logo-size">Size (%):</label>
                        <input type="number" id="logo-size" value="20" min="5" max="50">
                    </div>
                    <label for="logo-opacity">Opacity:</label>
                    <input type="range" id="logo-opacity" min="0.1" max="1" step="0.1" value="1">
                </div>
            </div>

            <div class="settings-section">
                <button id="save-settings">Save Settings (JSON)</button>
                <label for="load-settings">Load Settings:</label>
                <input type="file" id="load-settings" accept=".json">
            </div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="js/global-vars.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/elements.js"></script>
    <script src="js/canvas-render.js"></script>
    <script src="js/canvas-controls.js"></script>
    <script src="js/ui-controls.js"></script>
    <script src="js/canvas-interactions.js"></script>
    <script src="js/file-handling.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
