<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Design Tool - Optimized Version</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Modern Header -->
    <div class="header">
        <div class="logo-section">🎨 Brand Designer</div>
        <div class="header-actions">
            <input type="file" id="xlsx-upload" accept=".xlsx,.xls" style="display: none;">
            <button class="btn-primary" onclick="document.getElementById('xlsx-upload').click()">
                📊 Load Excel Data
            </button>
            <button class="btn-secondary" id="toggle-controls">⚙️ Advanced</button>
            <button class="btn-success" id="download-btn">💾 Export Design</button>
        </div>
    </div>

    <!-- Data Table (shown when Excel is loaded) -->
    <div id="data-section" style="display: none;">
        <div class="data-header">
            <h2>Imported Data</h2>
            <span id="data-count"></span>
        </div>
        <div id="rows-summary" class="data-table"></div>
    </div>

    <!-- Processing Status -->
    <div id="processing-status" class="status-message" style="display: none;">
        <div class="loading-spinner"></div>
        Loading your brand assets...
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
        <div class="canvas-area">
            <div class="image-upload-blank" id="upload-blank">
                <div class="upload-icon">📤</div>
                <p>Drop your background image here or click to browse</p>
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <button class="btn-outline" onclick="document.getElementById('image-upload').click()">
                    Choose Image
                </button>
            </div>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>

        <!-- Mini Toolbar (always visible) -->
        <div class="mini-toolbar">
            <div class="tool-group">
                <button class="tool-btn" id="add-text-btn" title="Add Text">
                    <span class="tool-icon">✏️</span>
                    Add Text
                </button>
                <button class="tool-btn" id="add-logo-btn" title="Add Logo">
                    <span class="tool-icon">🖼️</span>
                    Add Logo
                </button>
                <button class="tool-btn delete-btn" id="delete-element-btn" title="Delete Selected">
                    <span class="tool-icon">🗑️</span>
                    Delete
                </button>
            </div>

            <div class="tool-group">
                <button class="tool-btn compact" onclick="document.getElementById('toggle-controls').click();">
                    <span class="tool-icon">🎛️</span>
                    Controls
                </button>
            </div>
        </div>
    </div>

    <!-- Collapsed Advanced Controls -->
    <div id="advanced-controls" class="advanced-panel" style="display: none;">
        <div class="controls-grid">
            <div class="control-card">
                <h4>✏️ Text Settings</h4>
                <div class="control-group">
                    <label>Text Content:</label>
                    <input type="text" id="text-input" placeholder="Your slogan here">
                </div>
                <div class="control-group">
                    <label>X Position:</label>
                    <input type="range" id="text-x-slider" value="50" min="0" max="800">
                    <input type="number" id="text-x" value="50" min="0" max="800">
                </div>
                <div class="control-group">
                    <label>Y Position:</label>
                    <input type="range" id="text-y-slider" value="100" min="0" max="600">
                    <input type="number" id="text-y" value="100" min="0" max="600">
                </div>
                <div class="control-group">
                    <label>Font Size:</label>
                    <input type="range" id="text-size-slider" value="30" min="10" max="100">
                    <input type="number" id="text-size" value="30" min="10" max="100">
                </div>
                <div class="control-group">
                    <label for="text-font">Font Family:</label>
                    <select id="text-font">
                        <option value="Arial">Arial</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Text Color:</label>
                    <input type="color" id="text-color" value="#000000">
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="text-outline"> Outline Text
                </label>
            </div>

            <div class="control-card">
                <h4>🖼️ Image Settings</h4>
                <div class="control-group">
                    <label>Upload Logo:</label>
                    <input type="file" id="logo-upload" accept="image/*">
                </div>
                <div class="control-group">
                    <label>X Position:</label>
                    <input type="number" id="logo-x" value="600" min="0" max="800">
                </div>
                <div class="control-group">
                    <label>Y Position:</label>
                    <input type="number" id="logo-y" value="50" min="0" max="600">
                </div>
                <div class="control-group">
                    <label>Size (%):</label>
                    <input type="number" id="logo-size" value="20" min="5" max="50">
                </div>
                <div class="control-group">
                    <label>Opacity:</label>
                    <input type="range" id="logo-opacity" min="0.1" max="1" step="0.1" value="1">
                </div>
            </div>
        </div>

        <!-- Settings -->
        <div class="control-card">
            <h4>💼 Project Settings</h4>
            <div class="settings-actions">
                <button id="save-settings" class="btn-small">💾 Save Settings</button>
                <input type="file" id="load-settings" accept=".json" style="display: none;">
                <button class="btn-small" onclick="document.getElementById('load-settings').click()">📁 Load Settings</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script>
        // Optimized version of the design tool with XLSX and logo support
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size for better UX
        canvas.width = 800;
        canvas.height = 600;

        // UI elements
        const imageInput = document.getElementById('image-upload');
        const logoInput = document.getElementById('logo-upload');
        const textInput = document.getElementById('text-input');
        const textX = document.getElementById('text-x');
        const textY = document.getElementById('text-y');
        const textXSlider = document.getElementById('text-x-slider');
        const textYSlider = document.getElementById('text-y-slider');
        const textSize = document.getElementById('text-size');
        const textSizeSlider = document.getElementById('text-size-slider');
        const textOutline = document.getElementById('text-outline');
        const textColor = document.getElementById('text-color');
        const textFont = document.getElementById('text-font');
        const logoX = document.getElementById('logo-x');
        const logoY = document.getElementById('logo-y');
        const logoSize = document.getElementById('logo-size');
        const logoOpacity = document.getElementById('logo-opacity');
        const addTextBtn = document.getElementById('add-text-btn');
        const addLogoBtn = document.getElementById('add-logo-btn');
        const deleteElementBtn = document.getElementById('delete-element-btn');
        const downloadBtn = document.getElementById('download-btn');
        const saveBtn = document.getElementById('save-settings');
        const loadInput = document.getElementById('load-settings');
        const xlsxInput = document.getElementById('xlsx-upload');
        const rowsSummary = document.getElementById('rows-summary');
        const processingStatus = document.getElementById('processing-status');

        // Image data
        let backgroundImage = null;
        let rowsData = [];

        // Element management - simplified
        let selectedElement = null;
        let draggedElement = null;
        let isDragging = false;
        let isResizing = false;
        let resizeHandle = null;
        let elements = [];

        // Mouse flags
        let isMouseDown = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Create initial text element
        let initialTextElement = createTextElement('Enter your slogan here', 50, 100, 200, 60, 30, 'Arial', '#000000', false);
        initialTextElement.isSelected = true;
        selectedElement = initialTextElement;
        elements.push(initialTextElement);

        // Create text element
        function createTextElement(text, x, y, width, height, fontSize, font, color, outline) {
            return {
                id: Date.now() + Math.random(),
                type: 'text',
                text: text,
                x: x,
                y: y,
                width: width,
                height: height,
                fontSize: fontSize,
                font: font,
                color: color,
                outline: outline,
                isSelected: false
            };
        }

        // Create image element
        function createImageElement(image, x, y, width, height) {
            return {
                id: Date.now() + Math.random(),
                type: 'image',
                image: image,
                x: x,
                y: y,
                width: width,
                height: height,
                opacity: 1,
                isSelected: false
            };
        }

        // Load background image
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Please upload a valid image file.');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    backgroundImage = img;
                    renderCanvas();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Load logo image
        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Please upload a valid image file.');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    elements.forEach(el => el.isSelected = false);

                    const imageElement = createImageElement(img, 600, 50, 100, 100);
                    imageElement.isSelected = true;
                    selectedElement = imageElement;
                    elements.push(imageElement);
                    renderCanvas();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Add text button
        addTextBtn.addEventListener('click', () => {
            elements.forEach(el => el.isSelected = false);

            const textElement = createTextElement('New Text', 50, 130, 200, 60, 30, 'Arial', '#000000', false);
            textElement.isSelected = true;
            selectedElement = textElement;
            elements.push(textElement);
            renderCanvas();
        });

        // Add logo button
        addLogoBtn.addEventListener('click', () => {
            logoInput.click();
        });

        // Delete selected
        deleteElementBtn.addEventListener('click', () => {
            if (selectedElement) {
                const index = elements.indexOf(selectedElement);
                if (index > -1) {
                    elements.splice(index, 1);
                    selectedElement = null;
                    if (elements.length > 0) {
                        elements[0].isSelected = true;
                        selectedElement = elements[0];
                    }
                    renderCanvas();
                }
            }
        });

        // Sync text controls with selected element
        function syncTextElement() {
            if (selectedElement && selectedElement.type === 'text') {
                selectedElement.text = textInput.value;
                selectedElement.x = parseInt(textX.value) || 50;
                selectedElement.y = parseInt(textY.value) || 100;
                selectedElement.fontSize = parseInt(textSize.value) || 30;
                selectedElement.color = textColor.value;
                selectedElement.font = textFont.value;
                selectedElement.outline = textOutline.checked;
                textXSlider.value = selectedElement.x;
                textYSlider.value = selectedElement.y;
                textSizeSlider.value = selectedElement.fontSize;
                renderCanvas();
            }
        }

        // Sync image controls
        function syncImageElement() {
            if (selectedElement && selectedElement.type === 'image') {
                selectedElement.x = parseInt(logoX.value) || 600;
                selectedElement.y = parseInt(logoY.value) || 50;
                selectedElement.width = (parseInt(logoSize.value) || 20) / 100 * canvas.width;
                selectedElement.height = selectedElement.width;
                selectedElement.opacity = parseFloat(logoOpacity.value) || 1;
                renderCanvas();
            }
        }

        // Add event listeners
        [textInput, textX, textY, textSize, textColor, textFont, textOutline].forEach(el => {
            el.addEventListener('input', syncTextElement);
            el.addEventListener('change', syncTextElement);
        });

        [logoX, logoY, logoSize, logoOpacity].forEach(el => {
            el.addEventListener('input', syncImageElement);
            el.addEventListener('change', syncImageElement);
        });

        // Slider events
        textXSlider.addEventListener('input', () => {
            if (selectedElement && selectedElement.type === 'text') {
                textX.value = textXSlider.value;
                selectedElement.x = parseInt(textXSlider.value);
                renderCanvas();
            }
        });

        textYSlider.addEventListener('input', () => {
            if (selectedElement && selectedElement.type === 'text') {
                textY.value = textYSlider.value;
                selectedElement.y = parseInt(textYSlider.value);
                renderCanvas();
            }
        });

        textSizeSlider.addEventListener('input', () => {
            if (selectedElement && selectedElement.type === 'text') {
                textSize.value = textSizeSlider.value;
                selectedElement.fontSize = parseInt(textSizeSlider.value);
                renderCanvas();
            }
        });

        // Parse XLSX file
        xlsxInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data);
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(worksheet);
                rowsData = json;
                displayRowsSummary(json);
            } catch (error) {
                alert('Error parsing XLSX file. Please ensure it is a valid Excel file.');
            }
        });

        // Display rows summary with logo information
        function displayRowsSummary(rows) {
            rowsSummary.innerHTML = '<table><tr><th>Row</th><th>Image</th><th>Slogan</th><th>Logo</th><th>Action</th></tr></table>';
            rows.forEach((row, index) => {
                const tr = `<tr>
                    <td>${index + 1}</td>
                    <td>${row.ImageFileName || ''}</td>
                    <td>${row.Advertise || ''}</td>
                    <td>${row['Logo File'] || ''}</td>
                    <td><button data-row="${index}">Load</button></td>
                </tr>`;
                rowsSummary.querySelector('table').insertAdjacentHTML('beforeend', tr);
            });

            // Add click listeners
            rowsSummary.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') {
                    const index = e.target.dataset.row;
                    selectRow(index);
                }
            });
        }

        // Select row and auto-fill
        async function selectRow(index) {
            const row = rowsData[index];
            if (!row) return;

            processingStatus.style.display = 'block';

            try {
                // Load background image
                if (row.ImageFileName) {
                    const img = new Image();
                    img.onload = () => {
                        backgroundImage = img;
                    };
                    img.onerror = () => {
                        alert(`Image "${row.ImageFileName}" not found.`);
                    };
                    img.src = `images/${row.ImageFileName}`;
                }

                // Load logo if available
                if (row['Logo File']) {
                    const logoImg = new Image();
                    logoImg.onload = () => {
                        // Add logo to elements
                        const imageElement = createImageElement(logoImg, 600, 50, 100, 100);
                        imageElement.isSelected = false;
                        elements = elements.filter(el => el.type !== 'image'); // Remove existing logos
                        elements.push(imageElement);
                    };
                    logoImg.onerror = () => {
                        console.log(`Logo "${row['Logo File']}" not found.`);
                    };
                    logoImg.src = `images/logos/${row['Logo File']}`;
                }

                // Set text
                if (row.Advertise) {
                    if (selectedElement && selectedElement.type === 'text') {
                        selectedElement.text = row.Advertise;
                        textInput.value = row.Advertise;
                    }
                }

                setTimeout(() => {
                    renderCanvas();
                    processingStatus.style.display = 'none';
                }, 500);

            } catch (error) {
                console.error('Error loading row data:', error);
                processingStatus.style.display = 'none';
            }
        }

        // Render canvas
        function renderCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background
            if (backgroundImage) {
                ctx.drawImage(backgroundImage, 0, 0);
            } else {
                ctx.fillStyle = '#ddd';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Draw elements
            elements.forEach(element => {
                ctx.save();

                if (element.type === 'text') {
                    ctx.fillStyle = element.color;
                    ctx.strokeStyle = element.color;
                    ctx.lineWidth = 2;
                    ctx.font = `${element.fontSize}px ${element.font}`;

                    const lines = element.text.split('\n');
                    for (let i = 0; i < lines.length; i++) {
                        const lineY = element.y + (i + 1) * (element.fontSize * 1.2);
                        const lineX = element.x + 10;

                        if (element.outline) {
                            ctx.strokeText(lines[i], lineX, lineY);
                        } else {
                            ctx.fillText(lines[i], lineX, lineY);
                        }
                    }

                    const rectHeight = lines.length * (element.fontSize * 1.2) + 20;
                    element.height = Math.max(element.height, rectHeight);

                } else if (element.type === 'image') {
                    ctx.globalAlpha = element.opacity;
                    if (element.image && element.image.complete) {
                        ctx.drawImage(element.image, element.x, element.y, element.width, element.height);
                    }
                }

                // Draw selection outline
                if (element.isSelected) {
                    ctx.strokeStyle = '#007bff';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(element.x, element.y, element.width, element.height);
                    ctx.setLineDash([]);

                    // Draw resize handles
                    ctx.fillStyle = '#007bff';
                    const handleSize = 8;
                    ctx.fillRect(element.x - handleSize/2, element.y - handleSize/2, handleSize, handleSize);
                    ctx.fillRect(element.x + element.width - handleSize/2, element.y - handleSize/2, handleSize, handleSize);
                    ctx.fillRect(element.x - handleSize/2, element.y + element.height - handleSize/2, handleSize, handleSize);
                    ctx.fillRect(element.x + element.width - handleSize/2, element.y + element.height - handleSize/2, handleSize, handleSize);
                }

                ctx.restore();
            });
        }

        // Download functionality
        downloadBtn.addEventListener('click', () => {
            if (!backgroundImage) {
                alert('Please upload a background image before downloading.');
                return;
            }
            const link = document.createElement('a');
            link.download = 'designed-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Save/load settings
        saveBtn.addEventListener('click', () => {
            const settings = {
                textInput: textInput.value,
                textX: textX.value,
                textY: textY.value,
                textSize: textSize.value,
                textColor: textColor.value,
                textFont: textFont.value,
                logoX: logoX.value,
                logoY: logoY.value,
                logoSize: logoSize.value,
                logoOpacity: logoOpacity.value
            };
            const json = JSON.stringify(settings, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'settings.json';
            link.click();
        });

        loadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const settings = JSON.parse(e.target.result);
                    textInput.value = settings.textInput || '';
                    textX.value = settings.textX || 50;
                    textY.value = settings.textY || 100;
                    textSize.value = settings.textSize || 30;
                    textColor.value = settings.textColor || '#000000';
                    textFont.value = settings.textFont || 'Arial';
                    logoX.value = settings.logoX || 600;
                    logoY.value = settings.logoY || 50;
                    logoSize.value = settings.logoSize || 20;
                    logoOpacity.value = settings.logoOpacity || 1;
                    renderCanvas();
                } catch (error) {
                    alert('Error loading settings.');
                }
            };
            reader.readAsText(file);
        });

        // Mouse event handlers for interaction
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check for resize handles first
            if (selectedElement && selectedElement.isSelected) {
                const handleSize = 8;
                const handles = [
                    { name: 'top-left', x: selectedElement.x - handleSize/2, y: selectedElement.y - handleSize/2 },
                    { name: 'top-right', x: selectedElement.x + selectedElement.width - handleSize/2, y: selectedElement.y - handleSize/2 },
                    { name: 'bottom-left', x: selectedElement.x - handleSize/2, y: selectedElement.y + selectedElement.height - handleSize/2 },
                    { name: 'bottom-right', x: selectedElement.x + selectedElement.width - handleSize/2, y: selectedElement.y + selectedElement.height - handleSize/2 }
                ];

                for (let handle of handles) {
                    if (mouseX >= handle.x && mouseX <= handle.x + handleSize &&
                        mouseY >= handle.y && mouseY <= handle.y + handleSize) {
                        isResizing = true;
                        resizeHandle = handle.name;
                        dragOffsetX = mouseX;
                        dragOffsetY = mouseY;
                        return;
                    }
                }
            }

            // Check for element selection
            for (let i = elements.length - 1; i >= 0; i--) {
                const element = elements[i];
                if (mouseX >= element.x && mouseX <= element.x + element.width &&
                    mouseY >= element.y && mouseY <= element.y + element.height) {
                    elements.forEach(el => el.isSelected = false);
                    element.isSelected = true;
                    selectedElement = element;
                    isDragging = true;
                    dragOffsetX = mouseX - element.x;
                    dragOffsetY = mouseY - element.y;

                    // Update UI controls
                    if (element.type === 'text') {
                        textInput.value = element.text;
                        textX.value = element.x;
                        textY.value = element.y;
                        textSize.value = element.fontSize;
                        textColor.value = element.color;
                        textFont.value = element.font;
                        textOutline.checked = element.outline;
                        textXSlider.value = element.x;
                        textYSlider.value = element.y;
                        textSizeSlider.value = element.fontSize;
                    } else if (element.type === 'image') {
                        logoX.value = element.x;
                        logoY.value = element.y;
                        logoSize.value = Math.round((element.width / canvas.width) * 100);
                        logoOpacity.value = element.opacity;
                    }

                    renderCanvas();
                    return;
                }
            }

            // Deselect all if clicked elsewhere
            elements.forEach(el => el.isSelected = false);
            selectedElement = null;
            renderCanvas();
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isResizing && selectedElement) {
                const dx = mouseX - dragOffsetX;
                const dy = mouseY - dragOffsetY;

                switch (resizeHandle) {
                    case 'top-left':
                        selectedElement.x += dx;
                        selectedElement.y += dy;
                        selectedElement.width -= dx;
                        selectedElement.height -= dy;
                        break;
                    case 'top-right':
                        selectedElement.y += dy;
                        selectedElement.width += dx;
                        selectedElement.height -= dy;
                        break;
                    case 'bottom-left':
                        selectedElement.x += dx;
                        selectedElement.width -= dx;
                        selectedElement.height += dy;
                        break;
                    case 'bottom-right':
                        selectedElement.width += dx;
                        selectedElement.height += dy;
                        break;
                }

                // Update UI
                if (selectedElement.type === 'text') {
                    textX.value = Math.round(selectedElement.x);
                    textY.value = Math.round(selectedElement.y);
                    textXSlider.value = Math.round(selectedElement.x);
                    textYSlider.value = Math.round(selectedElement.y);
                } else if (selectedElement.type === 'image') {
                    logoX.value = Math.round(selectedElement.x);
                    logoY.value = Math.round(selectedElement.y);
                }

                dragOffsetX = mouseX;
                dragOffsetY = mouseY;
                renderCanvas();
            } else if (isDragging && selectedElement) {
                selectedElement.x = mouseX - dragOffsetX;
                selectedElement.y = mouseY - dragOffsetY;

                if (selectedElement.type === 'text') {
                    textX.value = Math.round(selectedElement.x);
                    textY.value = Math.round(selectedElement.y);
                    textXSlider.value = Math.round(selectedElement.x);
                    textYSlider.value = Math.round(selectedElement.y);
                } else if (selectedElement.type === 'image') {
                    logoX.value = Math.round(selectedElement.x);
                    logoY.value = Math.round(selectedElement.y);
                }

                renderCanvas();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
            resizeHandle = null;
        });

        // Toggle advanced controls
        const toggleControlsBtn = document.getElementById('toggle-controls');
        const advancedControls = document.getElementById('advanced-controls');
        const dataSection = document.getElementById('data-section');
        const uploadBlank = document.getElementById('upload-blank');

        toggleControlsBtn.addEventListener('click', () => {
            const isVisible = advancedControls.style.display !== 'none';
            advancedControls.style.display = isVisible ? 'none' : 'block';
            toggleControlsBtn.innerHTML = isVisible ? '⚙️ Advanced' : '🔽 Hide Advanced';
            toggleControlsBtn.classList.toggle('active', !isVisible);
        });

        // Show data section when Excel is loaded
        xlsxInput.addEventListener('change', () => {
            if (xlsxInput.files.length > 0) {
                dataSection.style.display = 'block';
            }
        });

        // Handle background image load - hide upload screen
        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadBlank.style.display = 'none';
                canvas.style.display = 'block';
            }
        });

        // Enhanced selectRow function - show table row count
        function displayRowsSummary(rows) {
            const countElement = document.getElementById('data-count');
            countElement.textContent = `${rows.length} items loaded`;

            rowsSummary.innerHTML = `<div class="modern-table">
                <div class="table-header">
                    <div>Row</div>
                    <div>Background</div>
                    <div>Slogan</div>
                    <div>Logo</div>
                    <div>Action</div>
                </div>
                ${rows.map((row, index) => `
                    <div class="table-row">
                        <div>${index + 1}</div>
                        <div>${row.ImageFileName || '—'}</div>
                        <div>${row.Advertise || '—'}</div>
                        <div>${row['Logo File'] || 'No logo'}</div>
                        <div><button class="load-btn" data-row="${index}">▶️ Load</button></div>
                    </div>
                `).join('')}
            </div>`;

            // Add click listeners with modern styling
            rowsSummary.addEventListener('click', (e) => {
                if (e.target.classList.contains('load-btn')) {
                    const index = parseInt(e.target.dataset.row);
                    selectRow(index);
                    // Highlight selected row
                    document.querySelectorAll('.table-row').forEach(row => row.classList.remove('selected'));
                    e.target.closest('.table-row').classList.add('selected');
                }
            });
        }

        // Enhanced selectRow with better UX feedback
        async function selectRow(index) {
            const row = rowsData[index];
            if (!row) return;

            processingStatus.style.display = 'flex';

            try {
                // Load background image
                if (row.ImageFileName) {
                    const img = new Image();
                    img.onload = () => {
                        backgroundImage = img;
                        uploadBlank.style.display = 'none';
                        canvas.style.display = 'block';
                    };
                    img.onerror = () => {
                        alert(`Image "${row.ImageFileName}" not found in images/`);
                    };
                    img.src = `images/${row.ImageFileName}`;
                }

                // Load logo if available
                if (row['Logo File']) {
                    const logoImg = new Image();
                    logoImg.onload = () => {
                        const imageElement = createImageElement(logoImg, 600, 50, 100, 100);
                        imageElement.isSelected = false;
                        elements = elements.filter(el => el.type !== 'image'); // Remove existing logos
                        elements.push(imageElement);
                        console.log(`✅ Logo "${row['Logo File']}" loaded`);
                    };
                    logoImg.onerror = () => {
                        console.log(`❌ Logo "${row['Logo File']}" not found`);
                    };
                    logoImg.src = `images/logos/${row['Logo File']}`;
                }

                // Set text
                if (row.Advertise) {
                    if (selectedElement && selectedElement.type === 'text') {
                        selectedElement.text = row.Advertise;
                        textInput.value = row.Advertise;
                    }
                }

                setTimeout(() => {
                    renderCanvas();
                    processingStatus.style.display = 'none';
                    alert(`✅ Row ${index + 1} loaded successfully!\n🎨 ${row.Advertise || 'No text'}\n🖼️ ${row['Logo File'] || 'No logo'}`);
                }, 800);

            } catch (error) {
                console.error('❌ Error loading row data:', error);
                processingStatus.style.display = 'none';
                alert('❌ Error loading data. Please check the file names.');
            }
        }

        // Initialize
        renderCanvas();
    </script>
</body>
</html>
